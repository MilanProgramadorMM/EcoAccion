<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoAccion — Mi impacto</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="telefono">
    <!-- HU06: Visualizar impacto ambiental -->
    <header class="encabezado">
      <a class="flecha" href="ranking.html" title="Volver">&larr;</a>
      <h1>Mi impacto</h1>
    </header>

    <main class="contenido">
      <select id="selector-periodo" class="selector-periodo">
        <option value="mes">Este mes</option>
        <option value="todo">Todo el tiempo</option>
      </select>

      <!-- Se reemplaza por el estado vacío si el usuario no tiene acciones -->
      <div id="panel-impacto">
        <div class="tarjeta-puntos">
          <span class="etiqueta-puntos">Puntos totales</span>
          <span class="valor-puntos"><span id="valor-puntos">0</span> pts</span>
          <span class="subtitulo-puntos" id="subtitulo-acciones"></span>
        </div>

        <h2 class="titulo-seccion">Impacto generado</h2>

        <div class="grid-impacto">
          <div class="tarjeta-impacto">
            <span class="etiqueta-impacto">CO&#8322; evitado</span>
            <span class="valor-impacto"><span id="valor-co2">0</span> kg</span>
          </div>
          <div class="tarjeta-impacto">
            <span class="etiqueta-impacto">Agua ahorrada</span>
            <span class="valor-impacto"><span id="valor-agua">0</span> L</span>
          </div>
          <div class="tarjeta-impacto">
            <span class="etiqueta-impacto">Energía ahorrada</span>
            <span class="valor-impacto"><span id="valor-energia">0</span> kWh</span>
          </div>
          <div class="tarjeta-impacto">
            <span class="etiqueta-impacto">Árboles plantados</span>
            <span class="valor-impacto"><span id="valor-arboles">0</span></span>
          </div>
        </div>
      </div>

      <div id="estado-vacio" class="estado-vacio" hidden>
        <p>Aún no has registrado acciones sostenibles en este período.</p>
        <a class="boton-primario boton-enlace" href="registrar.html">Registrar una acción</a>
      </div>
    </main>

    <!-- Navegación inferior -->
    <nav class="nav-inferior">
      <a href="registrar.html"><span class="icono">➕</span>Registrar</a>
      <a href="ranking.html"><span class="icono">🏆</span>Ranking</a>
      <a href="impacto.html" class="activo"><span class="icono">📊</span>Impacto</a>
    </nav>
  </div>

  <script src="js/impacto.js"></script>
</body>
</html>
